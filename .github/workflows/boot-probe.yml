name: redroid arm64 boot probe

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: idle observation minutes after the second boot
        default: "30"
      boot_timeout:
        description: seconds to wait for sys.boot_completed
        default: "420"
      image_ref:
        description: pinned redroid image digest (linux/arm64)
        default: "redroid/redroid@sha256:e194edc99aa364358d1f8c214acb18b6d006c74fa0561f39259a20173ec30b66"

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy]
    steps:
      - uses: actions/checkout@v4

      - name: host facts
        run: |
          set -uxo pipefail
          mkdir -p out
          echo "variant=${{ matrix.variant }}" | tee out/variant.txt
          date -u +%FT%TZ > out/started-at.txt
          uname -a | tee out/uname.txt
          cat /etc/os-release > out/os-release.txt
          getconf PAGESIZE > out/pagesize.txt
          nproc > out/nproc.txt
          free -h > out/free.txt
          df -h / > out/df.txt
          if sudo test -r "/boot/config-$(uname -r)"; then sudo cat "/boot/config-$(uname -r)" > out/kernel-config.txt; else echo none > out/kernel-config.txt; fi
          sha256sum out/kernel-config.txt > out/kernel-config.sha256
          grep -E '^CONFIG_(ANDROID_BINDER_IPC|ANDROID_BINDERFS|ANDROID_BINDER_DEVICES|MEMFD_CREATE|DMABUF_HEAPS|ARM64_4K_PAGES|ASHMEM)' out/kernel-config.txt | tee out/kernel-config-grep.txt
          docker version > out/docker-version.txt
          dpkg-query -W "linux-image-$(uname -r)" > out/kernel-package.txt 2>&1 || true
          true

      - name: binder, binderfs, memfd, adb
        run: |
          set -uxo pipefail
          binder=$(sed -n 's/^CONFIG_ANDROID_BINDER_IPC=//p' out/kernel-config.txt)
          echo "binder_config=${binder:-missing}" | tee out/binder.txt
          sudo apt-get update -qq
          if [ "$binder" = "m" ]; then
            modinfo binder_linux >/dev/null 2>&1 || sudo apt-get install -y "linux-modules-extra-$(uname -r)" 2>&1 | tail -2 | tee -a out/binder.txt
            sudo modprobe -v binder_linux devices=binder,hwbinder,vndbinder 2>&1 | tee -a out/binder.txt
            echo "modprobe_rc=${PIPESTATUS[0]}" | tee -a out/binder.txt
          fi
          lsmod | grep -i binder | tee -a out/binder.txt || true
          ls -l /dev | grep -i binder | tee -a out/binder.txt || echo "no legacy /dev/*binder* nodes" | tee -a out/binder.txt
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs 2>&1 | tee -a out/binder.txt
          sudo ls -l /dev/binderfs | tee -a out/binder.txt
          python3 -c "import os; fd=os.memfd_create('p', os.MFD_CLOEXEC); os.write(fd,b'ok'); print('memfd PASS')" | tee out/memfd.txt
          sudo apt-get install -y -qq adb >/dev/null 2>&1 || sudo apt-get install -y -qq android-tools-adb
          adb version > out/adb-version.txt
          true

      - name: pull pinned image
        run: |
          set -euxo pipefail
          IMG='${{ github.event.inputs.image_ref }}'
          echo "$IMG" > out/image-ref.txt
          sudo docker pull --platform linux/arm64 "$IMG" 2>&1 | tail -2
          sudo docker image inspect "$IMG" > out/image-inspect.json

      - name: cold boot 1 (fresh data)
        id: boot1
        run: |
          set -uxo pipefail
          sudo mkdir -p /srv/redroid-probe/data
          bash scripts/run_container.sh '${{ github.event.inputs.image_ref }}' '${{ matrix.variant }}'
          bash scripts/wait_boot.sh '${{ github.event.inputs.boot_timeout }}' out/boot1
          true

      - name: sentinel, stop, start
        if: steps.boot1.outputs.booted == '1'
        id: restart
        run: |
          set -uxo pipefail
          adb -s 127.0.0.1:5555 shell 'printf redroid-probe-v1 > /data/local/tmp/probe-sentinel' 2>&1 | tee out/sentinel-write.txt
          sudo docker stop --time 30 redroid-probe
          sudo docker inspect --format '{{.State.Status}}' redroid-probe | tee out/stopped-status.txt
          sudo docker start redroid-probe
          bash scripts/wait_boot.sh '${{ github.event.inputs.boot_timeout }}' out/restart
          adb -s 127.0.0.1:5555 shell cat /data/local/tmp/probe-sentinel 2>&1 | tee out/sentinel-after-restart.txt
          true

      - name: cold boot 2 (new container, persisted data)
        if: steps.boot1.outputs.booted == '1'
        id: boot2
        run: |
          set -uxo pipefail
          sudo docker stop --time 30 redroid-probe
          sudo docker rm redroid-probe
          bash scripts/run_container.sh '${{ github.event.inputs.image_ref }}' '${{ matrix.variant }}'
          bash scripts/wait_boot.sh '${{ github.event.inputs.boot_timeout }}' out/boot2
          adb -s 127.0.0.1:5555 shell cat /data/local/tmp/probe-sentinel 2>&1 | tee out/sentinel-after-recreate.txt
          true

      - name: idle observation
        if: steps.boot2.outputs.booted == '1'
        run: |
          set -uxo pipefail
          bash scripts/idle_observe.sh '${{ github.event.inputs.idle_minutes }}' out/idle
          echo "idle_rc=$?" | tee out/idle-rc.txt
          true

      - name: final evidence
        if: always()
        run: |
          set -uxo pipefail
          echo "boot1=${{ steps.boot1.outputs.booted }} restart=${{ steps.restart.outputs.booted }} boot2=${{ steps.boot2.outputs.booted }}" | tee out/summary.txt
          date -u +%FT%TZ > out/finished-at.txt
          sudo docker stop --time 30 redroid-probe || true
          sudo docker rm redroid-probe || true
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redroid-arm64-boot-probe-${{ matrix.variant }}-${{ github.run_id }}
          path: out
          if-no-files-found: warn
